spring:
  application:
    name: corevia-core
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

corevia:
  security:
    enabled: false

server:
  shutdown: graceful
