services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: corevia
      POSTGRES_USER: corevia
      POSTGRES_PASSWORD: corevia-local-only
    ports:
      - "5432:5432"
    volumes:
      - corevia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corevia -d corevia"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  corevia:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres-local
      COREVIA_DATABASE_URL: jdbc:postgresql://postgres:5432/corevia
      COREVIA_DATABASE_USERNAME: corevia
      COREVIA_DATABASE_PASSWORD: corevia-local-only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  corevia-postgres:
